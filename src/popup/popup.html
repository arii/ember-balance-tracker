<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ember Balance Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Ember Balance Tracker</h1>
    </header>

    <section id="train">
      <input id="label" type="text" placeholder="Label, e.g. Runware credits" maxlength="60" />
      <button id="train-btn" type="button">Track this balance</button>
      <p class="hint">On a page where you're already signed in: enter a label, click the button, then click the number on the page.</p>
    </section>

    <section id="trackers">
      <h2>Tracked balances</h2>
      <ul id="tracker-list"></ul>
      <p id="empty" class="hint">Nothing tracked yet.</p>
    </section>

    <footer>
      <span id="status" role="status"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
